[tool.poetry]
name = "hs-api"
version = "0.1.0"
description = ""
authors = ["Gwenevere Frank <jfrank@ucsd.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10,<3.11"
numpy = "^2.1.2"
pyyaml = "^6.0.2"
tqdm = "^4.66.5"
connectome_utils = {git = "https://github.com/Integrated-Systems-Neuroengineering/connectome_utils.git", rev = "181f8a86b9d76500c27c903fe36ffa4d8df300aa"}
jaal = "^0.1.7"
bidict = "^0.22.0"
fxpmath = {git = "https://github.com/jfrank8/fxpmath.git", branch = "master"}
hs_bridge = {git = "ssh://git@github.com/Integrated-Systems-Neuroengineering/hs_bridge.git", rev = "b5e4a840717e1f21a7fafbd1c3bdaa2fce1b5ed6", optional = true}

[tool.poetry.extras]
fpga = ["hs_bridge"]

[tool.poetry.group.apps.dependencies]
matplotlib = "^3.9.2"
spikingjelly = "^0.0.0.0.14"
snntorch = "^0.9.1"
tensorboard = "^2.18.0"


[tool.poetry.group.dev.dependencies]
pylint = "^3.3.4"
black = "^25.1.0"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.format]
max-line-length = "88"
